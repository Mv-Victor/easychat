worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   300s;
    types_hash_max_size 4096;
    client_max_body_size 100m;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    include /etc/nginx/conf.d/*.conf;

    # ===========================================================
    # HTTP Server (port 80) — Redirect to HTTPS
    # ===========================================================
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        # ★ Let's Encrypt ACME challenge (for certbot webroot renewal)
        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type "text/plain";
        }

        # 其他请求继续 301 跳 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================================
    # HTTPS Server — chat.tkcc.cloud → EasyChat (port 7860)
    # ===========================================================
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        server_name  chat.tkcc.cloud;

        # Let's Encrypt certificate — must include chat.tkcc.cloud
        # Run: certbot certonly --standalone -d tkcc.cloud -d www.tkcc.cloud -d chat.tkcc.cloud
        ssl_certificate     /etc/letsencrypt/live/tkcc.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tkcc.cloud/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;

        # Increase upload limit for image uploads
        client_max_body_size 16m;

        location / {
            proxy_pass http://127.0.0.1:7860;

            # Disable buffering for SSE streaming responses
            proxy_buffering       off;
            proxy_cache           off;
            chunked_transfer_encoding on;
            gzip                  off;

            proxy_http_version    1.1;
            proxy_set_header      Connection "";

            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;

            # Extended timeouts for long AI responses
            proxy_connect_timeout 60s;
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
        }
    }

    # ===========================================================
    # HTTPS Server with SSE / Streaming Proxy Configuration
    # ===========================================================
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        server_name  tkcc.cloud www.tkcc.cloud;

        # SSL Certificate
        ssl_certificate     /etc/letsencrypt/live/tkcc.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tkcc.cloud/privkey.pem;

        # SSL hardening
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;

        # ===========================================================
        # SSE / Streaming Proxy Configuration
        # ===========================================================
        # sub2api AI API uses SSE (Server-Sent Events) for streaming
        # responses. Default Nginx buffering will cause responses to
        # "stall then burst" instead of streaming character-by-character.
        # The settings below ensure real-time streaming behavior.

        location / {
            proxy_pass http://127.0.0.1:8080;

            # [CRITICAL] Disable proxy buffering — without this, AI
            # responses will buffer up and flush all at once, causing
            # perceived latency and potential timeout.
            proxy_buffering       off;
            proxy_cache           off;

            # SSE requires chunked transfer encoding
            chunked_transfer_encoding on;

            # Disable gzip for proxied content — compression introduces
            # additional buffering that breaks real-time streaming
            gzip off;

            # Use HTTP/1.1 for upstream connections (required for
            # keepalive and chunked encoding)
            proxy_http_version    1.1;
            proxy_set_header      Connection "";

            # Forward original request headers so the backend sees
            # the real client info
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;

            # Extended timeouts — AI generation can take minutes for
            # long responses; default 60s will kill the connection
            proxy_connect_timeout 60s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }
    }
}
